server {
    listen 80;
    server_name localhost;

    # Configuración para mejorar logging
    access_log /var/log/nginx/puravida-access.log;
    error_log /var/log/nginx/puravida-error.log;

    # Configuración para manejar solicitudes preflight OPTIONS
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token,Accept,Origin';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Configuración general para todas las rutas
    location / {
        # No agregar cabeceras CORS aquí, dejar que el backend las maneje
        
        # Configuración de proxy
        proxy_pass http://localhost:2300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Aumentar timeouts para evitar problemas con ngrok
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        # Importante: No filtrar ninguna cabecera de respuesta
        proxy_pass_header Set-Cookie;
        proxy_pass_header P3P;
        
        # Permitir respuestas grandes
        client_max_body_size 10M;
    }

    # Opcional: Configuración para archivos estáticos
    location /uploads {
        alias /ruta/completa/a/tu/carpeta/uploads;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
} 
server {
    listen 80;
    server_name localhost;

    # Configuración para mejorar logging
    access_log /var/log/nginx/ecommerce-access.log;
    error_log /var/log/nginx/ecommerce-error.log;

    # Configuración para peticiones OPTIONS (preflight CORS)
    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # Configuración de proxy
        proxy_pass http://localhost:2300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Aumentar timeouts para evitar problemas con ngrok
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        # Importante: No filtrar ninguna cabecera de respuesta
        proxy_pass_header Set-Cookie;
        proxy_pass_header P3P;
        
        # Permitir respuestas grandes
        client_max_body_size 10M;
    }

    # Configuración para la API
    location /api/ {
        proxy_pass http://localhost:2300/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Aumentar timeouts
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        # Permitir respuestas grandes
        client_max_body_size 10M;
    }

    # Opcional: Configuración para archivos estáticos
    location /uploads/ {
        alias /ruta/completa/a/tu/carpeta/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
} 